name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "specs/001-trip-route-planning/contracts/openapi.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "specs/001-trip-route-planning/contracts/openapi.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test-and-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @redocly/cli@1.34.5 lint specs/001-trip-route-planning/contracts/openapi.yaml
